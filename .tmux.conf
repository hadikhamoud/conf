# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Terminal settings
set -sg escape-time 0

# Enable xterm-keys to pass through Ctrl+arrow keys and other shortcuts
set-window-option -g xterm-keys on

# Set prefix to A
unbind-key C-b
set -gu prefix2
set -g prefix C-a
bind-key C-a send-prefix

# Rename your terminals
set -g set-titles on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on

# Vim-style pane navigation
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R

# Resize panes using Prefix + Shift+Arrow keys
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5

# New windows and splits open in current path
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Status bar - keep it aligned with terminal colors
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
setw -g window-status-style "bg=default,fg=colour7"
setw -g window-status-current-style "bg=default,fg=colour14,bold"
set -g message-style "bg=default,fg=colour14"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour14"

# Mouse support
set -g mouse on

# More scrollback
set -g history-limit 50000

# Focus events for better vim integration
set -g focus-events on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-save 'S'
set -g @continuum-restore 'on'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
